modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "Spotsimon2011"
description = '''
ComputerCraft peripheral for Minecraft Transit Railway signals.
Query signal type / sides / aspects, and switch each side between MTR's automatic
aspect and a manually forced aspect.
'''

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1]"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "mtr"
type = "required"
versionRange = "[4,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "computercraft"
type = "required"
versionRange = "[1.115,)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "mtr_signal_cc.mixins.json"
